# Runs the unit tests on GitHub's computers.
#  - Pushes to main, version tags (v1.2.3) and manual runs: Windows, macOS and Linux.
#  - Other branches and pull requests: Windows only (saves build minutes on a private
#    repository; the full set runs once the change reaches main).
name: Tests

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '["windows-latest", "macos-latest", "ubuntu-latest"]' || '["windows-latest"]') }}
    env:
      QT_QPA_PLATFORM: offscreen      # no screen on the test computers
      PYTHONFAULTHANDLER: "1"         # print where Python was if Qt crashes
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 libdbus-1-3 \
            libfontconfig1 libfreetype6 fonts-dejavu-core fonts-liberation libxrandr2

      - name: Install the program's packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -q -p no:cacheprovider
